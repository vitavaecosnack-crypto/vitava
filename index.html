<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vitava EcoSnack</title>
  <style>
    :root{
      --bg1:#dff7e2;
      --bg2:#ffffff;
      --ink:#5a2818;
      --ink-soft:#6d4a39;
      --green:#43a047;
      --teal:#00897b;
      --amber:#f9a825;
      --red:#d32f2f;
      --violet:#833ab4;
      --card:#ffffffd9;
      --shadow:0 14px 40px rgba(0,0,0,.14);
      --radius:28px;
      --heading-font: Georgia, 'Times New Roman', serif;
      --body-font: Arial, Helvetica, sans-serif;
      --accent-font: 'Trebuchet MS', 'Segoe UI', sans-serif;
    }

    *{ box-sizing:border-box; margin:0; padding:0; }
    html{ scroll-behavior:smooth; }
    body{
      font-family: var(--body-font);
      color:var(--ink);
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
      min-height:100vh;
      overflow-x:auto;
      overflow-y:auto;
      padding:18px 12px 40px;
      position:relative;
    }

    body::before,
    body::after{
      content:"";
      position:fixed;
      border-radius:50%;
      pointer-events:none;
      z-index:0;
      animation: drift 12s infinite alternate ease-in-out;
      opacity:.95;
    }
    body::before{
      width:720px; height:720px;
      background:rgba(76,175,80,.12);
      top:-280px; left:-260px;
      animation-duration:11s;
    }
    body::after{
      width:620px; height:620px;
      background:rgba(0,150,136,.12);
      bottom:-260px; right:-220px;
      animation-duration:13s;
    }

    @keyframes drift{
      from{ transform:translate3d(0,0,0) scale(1); }
      to{ transform:translate3d(24px, 36px, 0) scale(1.05); }
    }

    .page{
      position:relative;
      z-index:1;
      width:min(1120px, 100%);
      margin:0 auto;
    }

    .section{
      width:100%;
      border-radius:calc(var(--radius) + 4px);
      overflow:visible;
      box-shadow:var(--shadow);
      background:var(--card);
      backdrop-filter: blur(8px);
      border:1px solid rgba(255,255,255,.55);
      margin-bottom:24px;
    }

    .hero{
      padding:26px;
    }

    .hero-top{
      display:grid;
      grid-template-columns:1fr 350px;
      gap:28px;
      align-items:flex-start;
      margin-bottom:14px;
    }

    .hero-left{
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .eyebrow{
      display:inline-flex;
      align-items:center;
      gap:10px;
      font-family: var(--accent-font);
      font-weight:800;
      letter-spacing:.28em;
      font-size:12px;
      text-transform:uppercase;
      color:var(--ink-soft);
      margin-bottom:12px;
      width:fit-content;
    }

    .brand-title-row{
      display:flex;
      align-items:center;
      gap:14px;
      flex-wrap:wrap;
    }

    .brand-badge{
      width:58px;
      height:58px;
      border-radius:18px;
      display:grid;
      place-items:center;
      background:linear-gradient(135deg, #edf9ef, #d7f1dc);
      font-size:28px;
      box-shadow: inset 0 0 0 1px rgba(90,40,24,.06), 0 10px 22px rgba(0,0,0,.08);
      flex:0 0 auto;
    }

    .hero h1{
      font-family: var(--heading-font);
      font-size:clamp(2.35rem, 5vw, 3.2rem);
      line-height:.95;
      text-transform:uppercase;
      letter-spacing:-.04em;
      margin-bottom:12px;
      animation: floaty 3.2s ease-in-out infinite;
    }

    @keyframes floaty{
      0%,100%{ transform:translateY(0); }
      50%{ transform:translateY(-6px); }
    }

    .hero p.lead{
      font-size:clamp(1rem, 1.6vw, 1.12rem);
      line-height:1.85;
      color:#5f4637;
      max-width:62ch;
      margin-bottom:18px;
    }

    .hero-image-container{
      position:relative;
      width:100%;
      height:320px;
      border-radius:20px;
      overflow:hidden;
      box-shadow:0 15px 40px rgba(0,0,0,0.15);
    }

    .hero-image-container img{
      width:100%;
      height:100%;
      object-fit:cover;
      animation:fadeInImageHero 1.2s ease-out forwards;
      -webkit-mask-image:linear-gradient(90deg, rgba(0,0,0,1) 0%, rgba(0,0,0,1) 70%, rgba(0,0,0,0) 100%);
      mask-image:linear-gradient(90deg, rgba(0,0,0,1) 0%, rgba(0,0,0,1) 70%, rgba(0,0,0,0) 100%);
    }

    @keyframes fadeInImageHero{
      from{
        opacity:0;
        transform:translateX(30px);
      }
      to{
        opacity:1;
        transform:translateX(0);
      }
    }

    .buttons{
      display:flex;
      flex-wrap:wrap;
      gap:12px;
      margin-top:12px;
    }

    .btn{
      appearance:none;
      border:0;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      padding:16px 20px;
      border-radius:999px;
      color:#fff;
      font-weight:800;
      font-size:15px;
      box-shadow:0 10px 20px rgba(0,0,0,.12);
      cursor:pointer;
      transition:transform .22s ease, box-shadow .22s ease, opacity .22s ease;
      position:relative;
      overflow:hidden;
      user-select:none;
      font-family: var(--accent-font);
      min-height:52px;
    }
    .btn::before{
      content:"";
      position:absolute;
      inset:0;
      left:-120%;
      width:100%;
      background:linear-gradient(120deg, transparent, rgba(255,255,255,.28), transparent);
      transform:skewX(-24deg);
      transition:left .7s ease;
    }
    .btn:hover{ transform:translateY(-3px) scale(1.01); box-shadow:0 14px 28px rgba(0,0,0,.16); }
    .btn:hover::before{ left:120%; }
    .btn:active{ transform:translateY(0) scale(.99); }

    .btn-primary{ background:linear-gradient(135deg, #5a2818, #7b412b); }
    .btn-green{ background:linear-gradient(135deg, var(--green), #6cc46f); }
    .btn-teal{ background:linear-gradient(135deg, var(--teal), #2ab1a3); }
    .btn-amber{ background:linear-gradient(135deg, var(--amber), #f3c643); color:#5a2818; }
    .btn-red{ background:linear-gradient(135deg, var(--red), #ee6666); }
    .btn-violet{ background:linear-gradient(135deg, var(--violet), #b15ddb); }
    .btn-soft{ background:rgba(255,255,255,.82); color:var(--ink); border:1px solid rgba(90,40,24,.12); }

    .slide-nav{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:14px;
      z-index:10;
      position:relative;
    }

    .chip{
      border:1px solid rgba(90,40,24,.15);
      background:rgba(255,255,255,.84);
      color:var(--ink);
      border-radius:999px;
      padding:10px 14px;
      font-weight:800;
      font-size:13px;
      cursor:pointer;
      transition:transform .2s ease, background .2s ease;
      font-family: var(--accent-font);
      min-height:40px;
    }
    .chip:hover{ transform:translateY(-2px); background:#fff; }
    .chip.active{ background:#5a2818; color:#fff; border-color:#5a2818; }

    .scroll-hint{
      margin-top:14px;
      display:inline-flex;
      gap:8px;
      align-items:center;
      color:#6e4d3b;
      font-size:13px;
      font-weight:700;
      opacity:.9;
      font-family: var(--accent-font);
    }

    .hero-card-wrap{
      margin-top:18px;
      width:100%;
    }

    .hero-card{
      width:100%;
      border-radius:34px;
      background:rgba(255,255,255,.74);
      box-shadow:0 20px 50px rgba(0,0,0,.16);
      border:1px solid rgba(255,255,255,.8);
      padding:18px;
      backdrop-filter: blur(12px);
      animation: bob 4s ease-in-out infinite;
    }

    @keyframes bob{
      0%,100%{ transform:translateY(0); }
      50%{ transform:translateY(-10px); }
    }

    .hero-card-top{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:18px;
      margin-bottom:14px;
      flex-wrap:wrap;
    }

    .brand-stack small{
      display:block;
      font-family: var(--accent-font);
      font-size:11px;
      letter-spacing:.32em;
      font-weight:800;
      color:#7b4d3b;
      margin-bottom:4px;
    }

    .brand-stack h2{
      font-family: var(--heading-font);
      font-size:clamp(1.8rem, 4vw, 2.4rem);
      line-height:1;
      color:#5a2818;
    }

    .badge{
      width:56px;
      height:56px;
      border-radius:50%;
      display:grid;
      place-items:center;
      background:linear-gradient(135deg, #edf9ef, #d7f1dc);
      font-size:26px;
      box-shadow: inset 0 0 0 1px rgba(90,40,24,.06);
      flex:0 0 auto;
    }

    .stage{
      border-radius:30px;
      background:linear-gradient(180deg, rgba(255,255,255,.92), rgba(255,250,245,.88));
      border:1px solid rgba(90,40,24,.08);
      box-shadow:0 18px 36px rgba(0,0,0,.10);
      min-height:0;
      padding:18px;
      position:relative;
      overflow:visible;
      width:100%;
    }

    .slide-content{
      width:100%;
      opacity:0;
      transform:translateX(40px);
    }

    .slide-content.anim-next{ animation: slideInNext .38s ease forwards; }
    .slide-content.anim-prev{ animation: slideInPrev .38s ease forwards; }

    @keyframes slideInNext{
      from{ opacity:0; transform:translateX(42px); }
      to{ opacity:1; transform:translateX(0); }
    }
    @keyframes slideInPrev{
      from{ opacity:0; transform:translateX(-42px); }
      to{ opacity:1; transform:translateX(0); }
    }

    .slide-panel{
      width:100%;
      min-height:0;
      display:flex;
      flex-direction:column;
      gap:18px;
    }

    .section-title-with-image{
      width:100%;
      display:grid;
      grid-template-columns:1fr 200px;
      gap:20px;
      align-items:center;
      margin-bottom:16px;
    }

    .section-title-content{
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .section-title-label{
      font-family: var(--accent-font);
      font-size:12px;
      letter-spacing:.28em;
      text-transform:uppercase;
      font-weight:900;
      color:#7b4d3b;
    }

    .section-title-heading{
      font-family: var(--heading-font);
      font-size: clamp(1.55rem, 3.4vw, 2.45rem);
      line-height:1.08;
      text-transform:uppercase;
      letter-spacing:-.03em;
      color:#5a2818;
    }

    .section-image{
      position:relative;
      width:200px;
      height:200px;
      overflow:hidden;
      border-radius:16px;
      transform:skewY(-3deg);
      box-shadow:0 10px 30px rgba(0,0,0,0.2);
    }

    .section-image img{
      width:100%;
      height:100%;
      object-fit:cover;
      animation:fadeInImageTilt 1.2s ease-out forwards;
    }

    .section-image.with-fade img{
      -webkit-mask-image:linear-gradient(90deg, rgba(0,0,0,1) 0%, rgba(0,0,0,1) 70%, rgba(0,0,0,0) 100%);
      mask-image:linear-gradient(90deg, rgba(0,0,0,1) 0%, rgba(0,0,0,1) 70%, rgba(0,0,0,0) 100%);
    }

    @keyframes fadeInImageTilt{
      from{
        opacity:0;
        transform:skewY(-3deg) translateX(20px);
      }
      to{
        opacity:1;
        transform:skewY(-3deg) translateX(0);
      }
    }

    .slide-subtitle{
      color:#6b5142;
      line-height:1.8;
      font-size:15px;
      max-width:70ch;
    }

    .slide-stack,
    .cards-grid,
    .problem-list,
    .timeline,
    .catalog-grid,
    .economy-grid,
    .contact-grid{
      width:100%;
    }

    .slide-stack{
      display:flex;
      flex-direction:column;
      gap:14px;
      margin-top:8px;
    }

    .mini-card{
      border-radius:22px;
      padding:18px;
      min-height:110px;
      color:#5a2818;
      display:flex;
      flex-direction:column;
      justify-content:center;
      text-align:left;
      box-shadow:0 10px 18px rgba(0,0,0,.08);
      transition:transform .2s ease;
    }
    .mini-card:hover{ transform:translateY(-4px); }

    .mini-card .ico{ font-size:2.4rem; line-height:1; margin-bottom:6px; }
    .mini-card p{ margin-top:2px; font-weight:700; font-family: var(--accent-font); }
    .mini-card span{ display:block; margin-top:6px; font-size:13px; line-height:1.5; font-weight:500; opacity:.88; }

    .mini-fresh{ background:linear-gradient(135deg, #fde6ec, #f6b8c6); }
    .mini-art{ background:linear-gradient(135deg, #fce9be, #f1c56c); }
    .mini-order{ background:linear-gradient(135deg, #e5fff6, #bbf0dc); }
    .mini-eco{ background:linear-gradient(135deg, #edf8dd, #cfeea3); }

    .hero-tag{
      border-radius:20px;
      padding:14px 16px;
      background:#5a2818;
      color:#fff;
      box-shadow:0 12px 20px rgba(90,40,24,.18);
      font-weight:700;
      text-align:center;
      line-height:1.5;
      font-family: var(--accent-font);
    }

    .panel{
      padding:26px;
    }

    .panel h2{
      font-family: var(--heading-font);
      font-size:clamp(1.9rem, 4vw, 2.8rem);
      text-transform:uppercase;
      margin-bottom:10px;
      line-height:1;
    }

    .panel .sub{
      color:#6b5142;
      line-height:1.8;
      max-width:80ch;
      margin-bottom:24px;
      font-size:15px;
    }

    .cards-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(210px, 1fr));
      gap:14px;
    }

    .info-card{
      background:linear-gradient(180deg, #fff, #fff8f1);
      border-radius:26px;
      padding:18px;
      box-shadow:0 10px 18px rgba(0,0,0,.08);
      border:1px solid rgba(90,40,24,.06);
      min-height:200px;
    }

    .info-card .icon{ font-size:2rem; }
    .info-card h3{
      margin-top:12px;
      font-size:1.1rem;
      font-family: var(--heading-font);
    }
    .info-card p{ margin-top:10px; color:#6b5142; line-height:1.75; font-size:14px; }

    .two-col{
      display:grid;
      grid-template-columns:1.05fr .95fr;
      gap:16px;
      margin-top:20px;
    }

    .box{
      border-radius:30px;
      padding:20px;
      background:rgba(255,255,255,.82);
      box-shadow:0 10px 18px rgba(0,0,0,.08);
      border:1px solid rgba(90,40,24,.06);
      display:flex;
      flex-direction:column;
      gap:14px;
      min-width:0;
    }

    .box h3{
      font-family: var(--heading-font);
      font-size:1.45rem;
      margin-bottom:2px;
      text-transform:uppercase;
    }

    .box p,
    .box li{
      color:#6b5142;
      line-height:1.8;
      font-size:15px;
    }

    .problem-list{
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(185px, 1fr));
      gap:12px;
      margin-top:8px;
    }

    .problem-item{
      border-radius:20px;
      padding:14px;
      background:#fff;
      border:1px solid rgba(90,40,24,.08);
      box-shadow:0 8px 12px rgba(0,0,0,.05);
      min-width:0;
    }
    .problem-item strong{ display:block; margin-bottom:4px; }

    .timeline{
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(150px, 1fr));
      gap:12px;
      margin-top:8px;
      align-items:stretch;
    }

    .step{
      border-radius:22px;
      padding:16px;
      background:#fff;
      border:1px solid rgba(90,40,24,.08);
      box-shadow:0 8px 12px rgba(0,0,0,.05);
      min-height:180px;
      display:flex;
      flex-direction:column;
      justify-content:flex-start;
    }
    .step .num{
      width:34px;
      height:34px;
      border-radius:50%;
      display:grid;
      place-items:center;
      background:#5a2818;
      color:#fff;
      font-weight:900;
      margin-bottom:10px;
      font-family: var(--accent-font);
    }
    .step h4{ margin-bottom:8px; font-family: var(--heading-font); }
    .step p{ line-height:1.7; }

    .catalog-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(210px, 1fr));
      gap:14px;
      margin-top:16px;
    }

    .product-card{
      border-radius:28px;
      padding:16px;
      background:linear-gradient(180deg, #fff, #fff9f4);
      border:1px solid rgba(90,40,24,.08);
      box-shadow:0 10px 18px rgba(0,0,0,.08);
      min-width:0;
    }
    .product-thumb{
      height:150px;
      border-radius:22px;
      display:grid;
      place-items:center;
      font-size:3.3rem;
      margin-bottom:14px;
      background:linear-gradient(135deg, #f6efe7, #fff);
      border:1px dashed rgba(90,40,24,.16);
    }
    .product-card h4{ font-size:1.1rem; margin-bottom:6px; font-family: var(--heading-font); }
    .product-card p{ color:#6b5142; line-height:1.7; font-size:14px; }
    .price{
      margin-top:12px;
      display:inline-block;
      padding:9px 12px;
      border-radius:999px;
      font-weight:900;
      background:#5a2818;
      color:#fff;
      font-size:13px;
      font-family: var(--accent-font);
    }

    .economy-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));
      gap:14px;
      margin-top:16px;
    }
    .metric{
      border-radius:24px;
      padding:16px;
      background:#fff;
      border:1px solid rgba(90,40,24,.08);
      box-shadow:0 8px 12px rgba(0,0,0,.05);
      text-align:center;
    }
    .metric .val{
      font-size:2rem;
      font-weight:900;
      margin:6px 0 4px;
      color:#5a2818;
      font-family: var(--heading-font);
    }
    .metric .label{ color:#6b5142; font-size:14px; line-height:1.6; }

    .contact-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(170px, 1fr));
      gap:12px;
      margin-top:18px;
    }

    .footer-card{
      text-align:center;
      padding:18px 12px 0;
      color:#7b695e;
      font-size:14px;
      font-family: var(--accent-font);
    }

    .section-controls{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-top:6px;
    }

    .divider{
      margin:14px 0 6px;
      height:1px;
      background:linear-gradient(90deg, transparent, rgba(90,40,24,.18), transparent);
    }

    @media (max-width: 1024px){
      .hero-top{
        grid-template-columns:1fr;
        gap:16px;
      }
      .hero-image-container{
        height:250px;
      }
    }

    @media (max-width: 900px){
      .section-title-with-image{
        grid-template-columns:1fr;
        gap:14px;
      }
      .section-image{
        width:160px;
        height:160px;
      }
    }

    @media (max-width: 720px){
      body{ padding:12px 8px 28px; }
      .section{ border-radius:24px; }
      .hero{ padding:18px; }
      .panel{ padding:18px; }
      .hero-top{ grid-template-columns:1fr; gap:10px; }
      .brand-title-row{ gap:10px; }
      .brand-badge{ width:52px; height:52px; font-size:24px; border-radius:16px; }
      .hero h1{ font-size:clamp(2rem, 9.6vw, 2.95rem); }
      .hero p.lead{ font-size:14px; margin-bottom:14px; }
      .buttons,.slide-nav,.section-controls{ flex-direction:column; }
      .btn,.chip{ width:100%; }
      .hero-card{ padding:14px; }
      .hero-card-top{ margin-bottom:10px; }
      .brand-stack h2{ font-size:clamp(1.55rem, 7vw, 2rem); }
      .stage{ padding:14px; border-radius:22px; }
      .slide-panel{ gap:14px; }
      .section-title-heading{ font-size:clamp(1.35rem, 7vw, 1.9rem); }
      .slide-subtitle{ font-size:14px; line-height:1.65; }
      .mini-card{ min-height:auto; padding:14px; }
      .mini-card .ico{ font-size:2rem; }
      .mini-card p{ font-size:14px; }
      .mini-card span{ font-size:12px; }
      .hero-tag{ font-size:13px; padding:12px 14px; }
      .cards-grid,.problem-list,.timeline,.catalog-grid,.economy-grid,.contact-grid{ grid-template-columns:1fr; }
      .two-col{ grid-template-columns:1fr; gap:12px; }
      .box,.info-card,.product-card,.metric,.problem-item,.step{ padding:14px; }
      .info-card{ min-height:auto; }
      .product-thumb{ height:130px; font-size:3rem; }
      .step{ min-height:auto; }
      .slide-content{ transform:translateX(16px); }
      .slide-content.anim-next{ animation: slideInNext .28s ease forwards; }
      .slide-content.anim-prev{ animation: slideInPrev .28s ease forwards; }
      .section-title-with-image{ grid-template-columns:1fr; }
      .section-image{ width:120px; height:120px; }
      .hero-image-container{ height:200px; }
    }

    @media (max-width: 480px){
      .section-title-with-image{
        grid-template-columns:1fr;
        gap:12px;
      }
      .section-image{
        width:100px;
        height:100px;
        transform:skewY(-2deg);
      }
      .hero-image-container{
        height:180px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="section hero" id="inicio">
      <div class="hero-top">

    const slideNav = document.getElementById('slideNav');
    const slideContent = document.getElementById('slideContent');
    const heroTitle = document.getElementById('heroTitle');
    const heroSubtitle = document.getElementById('heroSubtitle');
    const heroEmoji = document.getElementById('heroEmoji');
    const heroImage = document.getElementById('heroImage');

    let active = 0;
    let audioCtx = null;

    function playTapSound(){
      try{
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if(!AudioContextClass) return;
        if(!audioCtx) audioCtx = new AudioContextClass();
        if(audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(520, now);
        osc.frequency.exponentialRampToValueAtTime(420, now + 0.06);
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.05, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.13);
      }catch(_e){}
    }

    function attachHandlers(){
      slideContent.querySelectorAll('[data-goto]').forEach((btn) => {
        btn.addEventListener('pointerdown', playTapSound, { passive:true });
        btn.addEventListener('click', () => {
          const target = Number(btn.getAttribute('data-goto'));
          goto(target);
        });
      });
      slideContent.querySelectorAll('a.btn').forEach((a) => {
        a.addEventListener('pointerdown', playTapSound, { passive:true });
      });
    }

    function renderSection(index, direction = 'next'){
      const s = slides[index];
      heroTitle.textContent = s.title;
      heroSubtitle.textContent = s.subtitle;
      heroEmoji.textContent = s.emoji;
      heroImage.src = s.image;
      heroImage.alt = s.title;
      [...slideNav.children].forEach((btn, i) => btn.classList.toggle('active', i === index));
      slideContent.classList.remove('anim-next', 'anim-prev');
      slideContent.innerHTML = s.html;
      void slideContent.offsetWidth;
      slideContent.classList.add(direction === 'prev' ? 'anim-prev' : 'anim-next');
      attachHandlers();
    }

    function goto(index){
      const direction = index < active ? 'prev' : 'next';
      active = index;
      renderSection(active, direction);
    }

    slides.forEach((s, index) => {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip' + (index === 0 ? ' active' : '');
      chip.textContent = s.label;
      chip.addEventListener('pointerdown', playTapSound, { passive:true });
      chip.addEventListener('click', () => goto(index));
      slideNav.appendChild(chip);
    });

    renderSection(0, 'next');
  </script>
